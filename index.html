<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sarina Zeitooni — Senior Front-End Developer</title>
    <meta
      name="description"
      content="Portfolio of Sarina Zeitooni — senior front-end developer with 5+ years building scalable React, Next.js, and TypeScript applications."
    />
    <meta property="og:title" content="Sarina Zeitooni — Senior Front-End Developer" />
    <meta
      property="og:description"
      content="Portfolio of Sarina Zeitooni — senior front-end developer with 5+ years building scalable React, Next.js, and TypeScript applications."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("portfolio-theme");
          var locale = localStorage.getItem("portfolio-locale");
          if (theme !== "light" && theme !== "dark") theme = "dark";
          if (locale !== "fa" && locale !== "en") locale = "en";
          document.documentElement.dataset.theme = theme;
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === "fa" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
